# ImmunoGrid — Mosquitto MQTT Broker Configuration
# Used by IoT devices to publish sensor data

listener 1883
allow_anonymous true

# WebSocket support (for browser-based dashboards)
listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all

# Connection limits
max_connections 1000
max_queued_messages 10000

# Keep-alive (set per-client via connect packets; not a global directive in Mosquitto 2.x)
