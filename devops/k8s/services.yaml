---
# ImmunoGrid — Kubernetes Services
# Exposes all microservices within the cluster and externally

apiVersion: v1
kind: Service
metadata:
  name: immunogrid-api-svc
  namespace: immunogrid
  labels:
    app: immunogrid-api
spec:
  selector:
    app: immunogrid-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: ws
      protocol: TCP
      port: 8001
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: immunogrid-frontend-svc
  namespace: immunogrid
spec:
  selector:
    app: immunogrid-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: immunogrid-postgres-svc
  namespace: immunogrid
spec:
  selector:
    app: immunogrid-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: immunogrid-redis-svc
  namespace: immunogrid
spec:
  selector:
    app: immunogrid-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: immunogrid-mqtt-svc
  namespace: immunogrid
spec:
  selector:
    app: immunogrid-mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: mqtt-ws
      port: 9001
      targetPort: 9001
  type: ClusterIP
