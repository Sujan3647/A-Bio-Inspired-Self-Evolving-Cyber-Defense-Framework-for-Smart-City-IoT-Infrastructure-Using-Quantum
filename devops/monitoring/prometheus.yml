global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'immunogrid'
    environment: 'production'
    project: 'bio-inspired-defense'

# Alerting rules
rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

scrape_configs:

  # ── ImmunoGrid Backend API — public /metrics endpoint ────────────────────
  - job_name: 'immunogrid-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # ── Node Exporter (host system metrics) ──────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 60s
