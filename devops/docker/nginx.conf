# ImmunoGrid — Nginx Reverse Proxy (Production)
# Sits in front of API + Frontend, handles SSL termination and routing

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options           "DENY"               always;
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-XSS-Protection          "1; mode=block"      always;
    add_header Referrer-Policy           "strict-origin"      always;
    add_header Permissions-Policy        "geolocation=()"     always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=100r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m  rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=ws:10m    rate=30r/m;
    limit_conn_zone $binary_remote_addr  zone=addr:10m;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream immunogrid_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream immunogrid_frontend {
        server frontend:80;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name immunogrid.gov.local _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 10M;

        # ── FastAPI Docs (dev only — remove in production) ─────────────────
        location ~ ^/api/(docs|redoc|openapi.json) {
            proxy_pass http://immunogrid_api;
            proxy_set_header Host $host;
        }

        # ── Authentication endpoints (strict rate limit) ────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://immunogrid_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (live event feed) ─────────────────────────────────────
        location /api/ws/ {
            limit_req zone=ws burst=10 nodelay;
            proxy_pass         http://immunogrid_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── All other API endpoints ─────────────────────────────────────────
        location /api/ {
            limit_req  zone=api burst=20 nodelay;
            limit_conn addr 20;

            proxy_pass         http://immunogrid_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  10s;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;

            # Cache GET responses briefly
            proxy_cache_methods GET HEAD;
        }

        # ── React frontend (SPA) ────────────────────────────────────────────
        location / {
            proxy_pass http://immunogrid_frontend;
            proxy_set_header Host $host;
            # SPA fallback
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        # ── Static asset caching ────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://immunogrid_frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health check (no rate limit) ────────────────────────────────────
        location = /api/health {
            proxy_pass http://immunogrid_api;
            access_log off;
        }

        # ── Block common attack paths ───────────────────────────────────────
        location ~ /\. { deny all; }
        location ~ /(wp-admin|phpmyadmin|admin\.php) { return 444; }
    }
}
