[pytest]
# ImmunoGrid — Unified Test Configuration

# Test discovery
testpaths =
    ai_brain
    backend
    blockchain
    crypto_layer
    honeypot
    iot_simulator
    quantum_engine
    aws_infra/lambda

# File patterns to discover
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# asyncio mode (needed by pytest-asyncio)
asyncio_mode = auto

# Markers
markers =
    unit:        Fast unit tests with no external dependencies
    integration: Tests that exercise multiple modules together
    backend:     FastAPI / HTTP tests
    slow:        Tests that take >5 seconds (e.g. quantum circuit, GAN training)
    gpu:         Tests that require a CUDA GPU

# Output
addopts =
    --tb=short
    --strict-markers
    -q
    -p no:pytest_ethereum

# Ignore generated / infra dirs
norecursedirs =
    .venv
    __pycache__
    .git
    node_modules
    aws_infra/terraform
    devops
    blockchain/fabric_network
    blockchain/solidity
    frontend
    paper
